<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slate C Compiler</title>
  <link rel="stylesheet" href="assets/codemirror.min.css">
  <link rel="stylesheet" href="assets/codemirror-dialog.min.css">
  <link rel="stylesheet" href="assets/codemirror-material-darker.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Slate C Compiler</h1>
    <div class="toolbar">
      <div class="row">
        <select id="examples" aria-label="Example">
          <option value="return42">Return 42</option>
          <option value="arithmetic">Functions and globals</option>
          <option value="loop">Loop</option>
          <option value="strings">Strings and data</option>
          <option value="floats">Floating point</option>
          <option value="libc">Libc output and allocation</option>
          <option value="files">File I/O</option>
        </select>
        <select id="keymap" aria-label="Editor key bindings">
          <option value="default">Standard</option>
          <option value="vim">Vim</option>
          <option value="emacs">Emacs</option>
        </select>
        <select id="target" aria-label="Target">
          <option value="x86_64-unknown-linux-musl">x86_64</option>
          <option value="aarch64-unknown-linux-musl">AArch64</option>
        </select>
      </div>
      <label class="flag-row">C compiler flags <input id="c-flags" value="-std=c17, -ffreestanding" spellcheck="false" placeholder="-std=c17, -DVALUE=42"></label>
      <label class="flag-row">Cranelift flags <input id="cranelift-flags" value="opt_level=speed" spellcheck="false" placeholder="opt_level=speed"></label>
      <details class="settings"><summary>Cranelift settings</summary><input id="flag-filter" aria-label="Filter Cranelift settings" placeholder="Filter settings"><div id="flag-settings"></div></details>
      <div class="row">
        <button id="compile" type="button" disabled>Compile and run</button>
        <button id="cancel" type="button" class="secondary" disabled>Stop</button>
        <button id="download-object" type="button" class="secondary" disabled>Download object</button>
        <button id="share" type="button" class="secondary">Share</button>
        <span id="status" role="status">Loading compiler…</span>
      </div>
    </div>
    <div class="grid">
      <section aria-labelledby="c-heading">
        <div class="section-header">
          <h2 id="c-heading">C</h2>
          <button id="copy-c" type="button" class="copy-button" aria-label="Copy C program" title="Copy C program">Copy</button>
        </div>
        <div class="editor-shell"><textarea id="c" aria-label="C source" spellcheck="false">int main(void) {
    return 42;
}</textarea></div>
      </section>
      <section aria-labelledby="output-tabs">
        <div class="section-header">
          <div id="output-tabs" role="tablist" aria-label="Compiler output">
            <button id="tokens-tab" type="button" role="tab" data-view="tokens" aria-selected="false" tabindex="-1">Tokens</button>
            <button id="ast-tab" type="button" role="tab" data-view="ast" aria-selected="false" tabindex="-1">Slate AST</button>
            <button id="slate_ir-tab" type="button" role="tab" data-view="slate_ir" aria-selected="false" tabindex="-1">Slate IR</button>
            <button id="clif-tab" type="button" role="tab" data-view="clif" aria-selected="true">Cranelift IR</button>
            <button id="assembly-tab" type="button" role="tab" data-view="assembly" aria-selected="false" tabindex="-1">Assembly</button>
            <button id="elf-tab" type="button" role="tab" data-view="elf" aria-selected="false" tabindex="-1">ELF</button>
          </div>
          <select id="output-view" aria-label="Compiler output" hidden><option value="tokens">Tokens</option><option value="ast">Slate AST</option><option value="slate_ir">Slate IR</option><option value="clif" selected>Cranelift IR</option><option value="assembly">Assembly</option><option value="elf">ELF</option></select>
          <select id="asm-syntax" aria-label="x86 assembly syntax" hidden><option value="intel">Intel</option><option value="att">AT&amp;T</option></select>
          <label id="show-bytes-control" class="toggle-control" hidden><input id="show-bytes" type="checkbox"> Show bytes</label>
          <button id="copy-clif" type="button" class="copy-button" aria-label="Copy compiler output" title="Copy compiler output" disabled>Copy</button>
        </div>
        <div id="output-shell" class="editor-shell" role="tabpanel" aria-labelledby="clif-tab">
          <textarea id="clif" aria-label="Compiler output" spellcheck="false"></textarea>
          <pre id="diagnostics" role="alert" hidden></pre>
        </div>
      </section>
    </div>
    <div class="execution" aria-live="polite">
      <span class="execution-label">Execution</span>
      <span id="execution">Waiting</span>
    </div>
    <div id="program-output" hidden>
      <section aria-labelledby="stdout-heading">
        <h2 id="stdout-heading">stdout</h2>
        <pre id="stdout" class="stream-output"></pre>
      </section>
      <section aria-labelledby="stderr-heading">
        <h2 id="stderr-heading">stderr</h2>
        <pre id="stderr" class="stream-output"></pre>
      </section>
    </div>
    <p class="scope"><a href="licenses/BLINK-LICENSE">Blink license</a></p>
    <noscript>This compiler requires JavaScript and WebAssembly.</noscript>
  </main>
  <script src="assets/codemirror.min.js"></script>
  <script src="assets/codemirror-clike.min.js"></script>
  <script src="assets/codemirror-dialog.min.js"></script>
  <script src="assets/codemirror-searchcursor.min.js"></script>
  <script src="assets/codemirror-vim.min.js"></script>
  <script src="assets/codemirror-emacs.min.js"></script>
  <script src="assets/codemirror-slate-ir.js"></script>
  <script src="output-modes.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
