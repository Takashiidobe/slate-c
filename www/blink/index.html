<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blink browser experiment</title>
  <style>
    body { max-width: 850px; margin: 40px auto; padding: 0 20px; font: 16px system-ui; background: #151922; color: #eee; }
    button, input { margin: 8px 8px 8px 0; }
    pre { padding: 16px; background: #080b11; min-height: 140px; white-space: pre-wrap; }
    a { color: #9bd; }
  </style>
</head>
<body>
  <h1>Blink browser experiment</h1>
  <p>Run a static x86_64 Linux executable without booting a kernel.</p>
  <button id="example">Run musl example</button>
  <label>Executable <input id="file" type="file"></label>
  <button id="stop" disabled>Stop</button>
  <p id="status" role="status">Ready</p>
  <pre id="output" aria-label="Program output"></pre>
  <a href="BLINK-LICENSE">Blink license</a>
  <script type="module" src="app.js"></script>
</body>
</html>
