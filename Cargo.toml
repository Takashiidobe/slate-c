[package]
name = "slate-c"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "slate-c"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
anyhow = "1"
clif2wasm = { path = "vendor/clif2wasm" }
cranelift-codegen = { version = "=0.130.0", default-features = false, features = ["std"] }
cranelift-frontend = "=0.130.0"
cranelift-jit = { version = "=0.130.0", optional = true }
cranelift-module = { version = "=0.130.0", optional = true }
cranelift-native = { version = "=0.130.0", optional = true }
cranelift-object = { version = "=0.130.0", optional = true }
slate-parser = "0.1.0"
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = ["native"]
native = ["dep:cranelift-native", "dep:cranelift-object", "dep:cranelift-jit", "dep:cranelift-module", "cranelift-codegen/host-arch"]
web = ["dep:wasm-bindgen"]

[patch.crates-io]
slate-parser = { path = "vendor/slate-parser" }
